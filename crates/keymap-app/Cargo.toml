[package]
name = "keymap"
version.workspace = true
edition.workspace = true
license.workspace = true

# `keymap` is the light client (no GTK); `keymap-ui` is the resident overlay.
[lib]
path = "src/lib.rs"

[[bin]]
name = "keymap"
path = "src/main.rs"

[[bin]]
name = "keymap-ui"
path = "src/ui_main.rs"

[dependencies]
glib-unix = "0.22"
libc = "0.2"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
gtk4-layer-shell = "0.8.1"
keymap-core = { version = "0.1.0", path = "../keymap-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[dev-dependencies]
tempfile = "3.27.0"
